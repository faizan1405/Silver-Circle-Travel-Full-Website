name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'hkkktpnwqqaeliesfyyg' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_QCuyIRO9nR6GvskRj9tZmg_bGIhUflv' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://c--32203d29-95cd-4c75-98d3-1dd5042bd211-prod.lovable.cloud' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'hkkktpnwqqaeliesfyyg' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_QCuyIRO9nR6GvskRj9tZmg_bGIhUflv' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://c--32203d29-95cd-4c75-98d3-1dd5042bd211-prod.lovable.cloud' }}
